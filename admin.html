<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechSecure - Admin Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 100%;
            margin: 0 auto;
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1 { color: #38bdf8; text-align: center; font-size: 22px; margin-bottom: 5px; }
        p.subtitle { text-align: center; font-size: 13px; color: #94a3b8; margin-top: 0; }
        h2 { color: #38bdf8; border-bottom: 2px solid #334155; padding-bottom: 5px; margin-top: 25px; font-size: 18px; }

        /* Muonekano wa Kadi (Cards) badala ya Table ngumu kwenye simu */
        .card-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }
        .item-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .item-card div {
            margin-bottom: 6px;
            font-size: 14px;
            word-break: break-word;
        }
        .item-card div:last-child {
            margin-bottom: 0;
        }
        .label {
            color: #38bdf8;
            font-weight: bold;
            display: inline-block;
            width: 110px;
        }
        .empty-msg {
            text-align: center;
            color: #94a3b8;
            padding: 15px;
            background: #0f172a;
            border-radius: 6px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Admin Dashboard</h1>
        <p class="subtitle">TechSecure System Management</p>

        <h2>Wateja Waliojisajili (Users)</h2>
        <div id="usersContainer" class="card-list">
            <div class="empty-msg">Inapakia wateja...</div>
        </div>

        <h2>Maombi ya Huduma (Service Requests)</h2>
        <div id="requestsContainer" class="card-list">
            <div class="empty-msg">Inapakia maombi...</div>
        </div>

        <!-- Sehemu mpya ya Usalama: Inaonyesha mashambulizi yaliyozuiwa -->
        <h2>🛡️ Security Audit Logs (Wavizaji Waliokamatwa)</h2>
        <div id="securityContainer" class="card-list">
            <div class="empty-msg">Inapakia kumbukumbu za usalama...</div>
        </div>
    </div>

    <script>
        async function loadAdminData() {
            try {
                // Kupata Watumiaji
                const resUsers = await fetch('/api/admin/users');
                const users = await resUsers.json();
                const usersContainer = document.getElementById('usersContainer');

                if (users && users.length > 0) {
                    usersContainer.innerHTML = users.map(u => `
                        <div class="item-card">
                            <div><span class="label">Jina:</span> ${u.name || u.fullName}</div>
                            <div><span class="label">Email:</span> ${u.email}</div>
                            <div><span class="label">Simu:</span> ${u.phone || u.phoneNumber}</div>
                            <div><span class="label">Tarehe:</span> ${new Date().toLocaleString()}</div>
                        </div>
                    `).join('');
                } else {
                    usersContainer.innerHTML = `<div class="empty-msg">Hakuna wateja bado.</div>`;
                }

                // Kupata Maombi ya Huduma
                const resReqs = await fetch('/api/admin/requests');
                const requests = await resReqs.json();
                const requestsContainer = document.getElementById('requestsContainer');

                if (requests && requests.length > 0) {
                    requestsContainer.innerHTML = requests.map(r => `
                        <div class="item-card">
                            <div><span class="label">Mteja:</span> ${r.full_name || r.fullName}</div>
                            <div><span class="label">Simu:</span> ${r.phone || r.phoneNumber}</div>
                            <div><span class="label">Huduma:</span> ${r.service_category || r.service}</div>
                            <div><span class="label">Maelezo:</span> ${r.description || r.message}</div>
                            <div><span class="label">Tarehe:</span> ${r.created_at || r.createdAt}</div>
                        </div>
                    `).join('');
                } else {
                    requestsContainer.innerHTML = `<div class="empty-msg">Hakuna maombi bado.</div>`;
                }

                // Kupata Kumbukumbu za Mashambulizi (Security Logs)
                const resLogs = await fetch('/api/admin/security-logs');
                const logs = await resLogs.json();
                const securityContainer = document.getElementById('securityContainer');

                if (logs && logs.length > 0) {
                    securityContainer.innerHTML = logs.map(l => `
                        <div class="item-card" style="border-color: #ef4444; background: #180808;">
                            <div><span class="label" style="color: #ef4444;">IP:</span> ${l.ip}</div>
                            <div><span class="label" style="color: #ef4444;">Eneo:</span> ${l.endpoint}</div>
                            <div><span class="label" style="color: #ef4444;">Sababu:</span> <span style="color: #fca5a5;">${l.reason}</span></div>
                            <div><span class="label" style="color: #ef4444;">Muda:</span> ${l.timestamp}</div>
                        </div>
                    `).join('');
                } else {
                    securityContainer.innerHTML = `<div class="empty-msg" style="color: #10b981;">Hakuna shambulio lililogunduliwa. Mfumo uko salama salimini!</div>`;
                }

            } catch (err) {
                console.error("Hitilafu ya kupata data za admin:", err);
            }
        }

        loadAdminData();
    </script>
</body>
</html>
